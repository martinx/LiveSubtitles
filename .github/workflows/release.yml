name: Release

# Pushing a v* tag builds, signs, notarises and publishes a GitHub Release.
#
# Signing and notarisation are optional: without the secrets below the workflow still
# produces a working (ad-hoc signed) zip, it just carries a Gatekeeper warning when
# downloaded. See README -> Releasing for the secret names.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0 (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ---------------------------------------------------------------- signing ---
      - name: Import the Developer ID certificate
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"

      # ------------------------------------------------------------------ build ---
      - name: Build and sign
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make build

      # ------------------------------------------------------------- notarising ---
      - name: Write the App Store Connect API key
        if: ${{ secrets.APPLE_API_KEY_P8 != '' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"

      - name: Package for notarisation
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: make dist

      - name: Notarise
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_ID:-}" ]; then
            ARGS=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          elif [ -n "${APPLE_ID:-}" ]; then
            ARGS=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "::warning::Signing secrets present but no notarisation credentials - shipping a signed but unnotarised build"
            exit 0
          fi

          xcrun notarytool submit build/LiveSubtitles.zip "${ARGS[@]}" --wait --timeout 30m
          xcrun stapler staple build/LiveSubtitles.app
          xcrun stapler validate build/LiveSubtitles.app

          # Re-zip so the stapled ticket travels with the download.
          make dist

      - name: Check Gatekeeper's verdict
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          spctl --assess --type execute --verbose=4 build/LiveSubtitles.app || \
            echo "::warning::spctl rejected the bundle - it is signed but not notarised"

      # ---------------------------------------------------------------- publish ---
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            build/LiveSubtitles.zip \
            --title "$TAG" \
            --generate-notes
