name: Release

# Pushing a v* tag builds, signs, notarises and publishes a GitHub Release.
#
# Signing and notarisation are optional: without the secrets below the workflow still
# produces a working (ad-hoc signed) zip, it just carries a Gatekeeper warning when
# downloaded. See README -> Releasing for the secret names.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0 (must already exist)'
        required: true
      dry_run:
        description: 'Build, sign and notarise, but do not publish a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 60

    # `secrets` is not an available context in a step-level `if`, so the flags it
    # controls are computed once here and tested as env.
    env:
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ---------------------------------------------------------------- signing ---
      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046  # word splitting is intended: one path per keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"

      # ------------------------------------------------------------------ build ---
      - name: Build and sign
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: make build

      # ------------------------------------------------------------- notarising ---
      - name: Write the App Store Connect API key
        if: env.HAS_API_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"

      # Always: these are the release assets, signed or not. The zip is what the in-app
      # updater downloads; the disk image is the human-friendly download.
      - name: Package the release
        run: make dist

      - name: Package the disk image
        run: make dmg

      - name: Notarise
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_ID:-}" ]; then
            ARGS=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          elif [ -n "${APPLE_ID:-}" ]; then
            ARGS=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            echo "::warning::Signing secrets present but no notarisation credentials - shipping a signed but unnotarised build"
            exit 0
          fi

          xcrun notarytool submit build/LiveSubtitles.zip "${ARGS[@]}" --wait --timeout 30m
          xcrun stapler staple build/LiveSubtitles.app
          xcrun stapler validate build/LiveSubtitles.app

          # Re-package so the stapled ticket travels with the downloads.
          make dist
          make dmg

      - name: Check Gatekeeper's verdict
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          spctl --assess --type execute --verbose=4 build/LiveSubtitles.app || \
            echo "::warning::spctl rejected the bundle - it is signed but not notarised"

      # ---------------------------------------------------------------- publish ---
      - name: Upload the artefacts (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: LiveSubtitles-${{ github.event.inputs.tag }}
          path: |
            build/LiveSubtitles.zip
            build/LiveSubtitles.dmg

      # CHANGELOG.md is the source of truth for what changed. Composing the description
      # from it, rather than letting GitHub just list commits, is what makes a release
      # readable. The step fails outright when the tag has no section, so notes can never
      # silently degenerate into a bare compare link.
      - name: Compose the release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p build
          scripts/changelog-for.sh "$TAG" > build/release-notes.md
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            {
              echo
              echo '---'
              echo
              printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV" "$TAG"
            } >> build/release-notes.md
          fi
          echo "----- release notes -----"
          cat build/release-notes.md

      - name: Publish the release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            build/LiveSubtitles.zip \
            build/LiveSubtitles.dmg \
            --title "$TAG" \
            --notes-file build/release-notes.md
